<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LegacyTap — Video Follow-Ups for Final Expense Agents</title>
<style>
  :root{
    --bg:#0b1020; --bg2:#0f1730; --panel:#131c38; --panel2:#182347;
    --line:#243057; --line2:#2f3c69;
    --txt:#eaf0ff; --mut:#98a6d3; --mut2:#6f7fb0;
    --brand:#2f6dff; --brand2:#5b8bff; --accent:#12c8a5;
    --hot:#ff5a5f; --warm:#ffb020; --cold:#5b8bff;
    --good:#22c55e; --shadow:0 10px 30px rgba(0,0,0,.35);
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#16224a 0%,var(--bg) 55%);
    color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit}
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  /* Sidebar */
  .side{background:linear-gradient(180deg,var(--bg2),#0b1226);border-right:1px solid var(--line);
    padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--accent));
    display:grid;place-items:center;font-weight:800;color:#fff;box-shadow:0 6px 18px rgba(47,109,255,.45)}
  .brand h1{font-size:17px;margin:0;letter-spacing:.2px}
  .brand small{display:block;color:var(--mut2);font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--mut);
    font-size:14px;font-weight:600;text-align:left;transition:.15s;width:100%}
  .nav button:hover{background:var(--panel);color:var(--txt)}
  .nav button.active{background:linear-gradient(90deg,rgba(47,109,255,.22),rgba(47,109,255,.05));color:#fff;
    box-shadow:inset 0 0 0 1px var(--line2)}
  .nav .ic{width:18px;text-align:center;font-size:15px}
  .side .up{margin-top:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
  .side .up b{font-size:13px}
  .side .up p{margin:4px 0 10px;color:var(--mut);font-size:12px;line-height:1.4}
  .side .up button{width:100%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
    padding:9px;border-radius:9px;font-weight:700;font-size:13px}
  /* Main */
  .main{padding:26px 30px 60px;max-width:1180px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:16px}
  .topbar .title h2{margin:0;font-size:23px;letter-spacing:.2px}
  .topbar .title p{margin:4px 0 0;color:var(--mut);font-size:13.5px}
  .btn{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);padding:10px 15px;border-radius:10px;
    font-weight:650;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
  .btn:hover{border-color:var(--brand2);background:#1c2a55}
  .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border:none;box-shadow:0 8px 22px rgba(47,109,255,.35)}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
  .btn.danger:hover{border-color:var(--hot);color:#ffd7d8}
  /* Cards & grid */
  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);
    padding:18px;box-shadow:var(--shadow)}
  .stat{position:relative;overflow:hidden}
  .stat .lab{color:var(--mut);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .stat .val{font-size:30px;font-weight:800;margin-top:8px;letter-spacing:.5px}
  .stat .delta{font-size:12px;font-weight:700;margin-top:5px}
  .up{color:var(--good)} .down{color:var(--hot)}
  .stat .spark{position:absolute;right:14px;bottom:12px;opacity:.85}
  .sec-title{font-size:15px;font-weight:750;margin:26px 0 13px;display:flex;align-items:center;gap:9px}
  .sec-title .pill{font-size:11px;color:var(--accent);background:rgba(18,200,165,.12);padding:3px 9px;border-radius:20px;font-weight:700}
  /* Chart */
  .chartwrap{display:flex;align-items:flex-end;gap:10px;height:150px;padding:6px 2px 0}
  .bar{flex:1;background:linear-gradient(180deg,var(--brand2),var(--brand));border-radius:7px 7px 3px 3px;position:relative;min-height:4px;transition:.4s}
  .bar span{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mut);font-weight:700}
  .bar small{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mut2)}
  /* Lists / tables */
  .row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .av{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
  .temp{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
  .t-hot{background:rgba(255,90,95,.16);color:#ff8a8e} .t-warm{background:rgba(255,176,32,.16);color:#ffc861}
  .t-cold{background:rgba(91,139,255,.16);color:#9db6ff}
  .muted{color:var(--mut)} .mut2{color:var(--mut2)}
  .fz12{font-size:12px} .fz13{font-size:13px} .fw7{font-weight:700}
  .score{font-weight:800;font-size:16px}
  .barmini{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;flex:none}
  .barmini > i{display:block;height:100%;border-radius:6px}
  /* Card tiles */
  .tile{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.18s;cursor:pointer}
  .tile:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 16px 34px rgba(0,0,0,.4)}
  .tile .thumb{aspect-ratio:16/10;background:#0a1128 center/cover;position:relative;display:grid;place-items:center}
  .tile .thumb .play{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#0b1020;font-size:19px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .tile .thumb .badge{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.55);padding:4px 9px;border-radius:20px;backdrop-filter:blur(6px)}
  .tile .meta{padding:13px 14px}
  .tile .meta h4{margin:0 0 4px;font-size:14.5px}
  .tile .meta .st{display:flex;gap:14px;margin-top:9px;color:var(--mut);font-size:12px}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(4,8,20,.72);backdrop-filter:blur(4px);display:none;place-items:center;z-index:60;padding:24px}
  .overlay.on{display:grid}
  .modal{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);border-radius:18px;width:100%;max-width:720px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
  .modal .mh h3{margin:0;font-size:17px}
  .modal .mb{padding:22px}
  .x{width:32px;height:32px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;color:var(--mut);font-size:17px}
  .x:hover{color:#fff;background:#22305c}
  label.fl{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:15px 0 7px}
  .in{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;color:var(--txt);font-size:14px}
  .in:focus{outline:none;border-color:var(--brand2)}
  textarea.in{min-height:78px;resize:vertical}
  .chipset{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{background:var(--panel2);border:1px solid var(--line2);padding:8px 12px;border-radius:22px;font-size:12.5px;font-weight:650;display:inline-flex;gap:7px;align-items:center}
  .chip.on{background:rgba(47,109,255,.18);border-color:var(--brand2);color:#fff}
  .chip .rm{color:var(--mut2);font-weight:800}
  .tmpl{border:1px solid var(--line2);border-radius:11px;padding:13px;cursor:pointer;transition:.15s}
  .tmpl:hover{border-color:var(--brand2);background:var(--panel2)}
  .tmpl b{font-size:13.5px} .tmpl p{margin:5px 0 0;color:var(--mut);font-size:12px;line-height:1.45}
  /* recipient phone */
  .phone{width:330px;margin:0 auto;background:#05070f;border-radius:34px;padding:12px;border:1px solid #223;box-shadow:0 30px 70px rgba(0,0,0,.6)}
  .phone .screen{background:#0a0f1f;border-radius:24px;overflow:hidden}
  .pvid{aspect-ratio:9/13;background:#0a1128 center/cover;position:relative;display:grid;place-items:center}
  .pvid .play{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#0b1020;font-size:22px}
  .pvid .agent{position:absolute;bottom:12px;left:12px;display:flex;align-items:center;gap:9px}
  .pvid .agent .av{width:34px;height:34px}
  .pbody{padding:16px}
  .pbody h3{margin:0 0 4px;font-size:16px}
  .pbtns{display:grid;gap:9px;margin-top:14px}
  .pbtn{background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:12px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:10px;justify-content:center}
  .pbtn.main{background:linear-gradient(135deg,var(--brand),var(--brand2));border:none}
  /* automation flow */
  .flow{display:flex;flex-direction:column;gap:0}
  .step{display:flex;gap:14px}
  .step .rail{display:flex;flex-direction:column;align-items:center;flex:none}
  .step .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:none;
    background:var(--panel2);border:1px solid var(--line2)}
  .step .dot.trig{background:linear-gradient(135deg,var(--brand),var(--brand2));border:none}
  .step .dot.act{background:rgba(18,200,165,.15);border-color:var(--accent);color:var(--accent)}
  .step .dot.wait{background:rgba(255,176,32,.13);border-color:var(--warm);color:var(--warm)}
  .step .line{width:2px;flex:1;background:var(--line2);min-height:16px;margin:3px 0}
  .step .body{padding:2px 0 20px;flex:1}
  .step .body b{font-size:13.5px}
  .step .body p{margin:4px 0 0;color:var(--mut);font-size:12.5px;line-height:1.5}
  .step .body .tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .toggle{width:42px;height:24px;border-radius:20px;background:var(--panel2);border:1px solid var(--line2);position:relative;flex:none;transition:.2s}
  .toggle.on{background:var(--brand)}
  .toggle i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
  .toggle.on i{left:20px}
  /* automation engine ui */
  .clockbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);border-radius:14px;padding:13px 16px;margin-bottom:20px}
  .clockbar .daybig{font-size:15px;font-weight:800}
  .clockbar .sub{color:var(--mut2);font-size:12px}
  .clockbar .spacer{flex:1}
  .seqcard-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .enrollstrip{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 16px}
  .epill{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:5px 11px 5px 5px;font-size:12px;font-weight:650}
  .epill .av{width:22px;height:22px;font-size:10px}
  .epill .nx{color:var(--mut2);font-size:11px}
  .abanner{background:rgba(47,109,255,.1);border:1px solid var(--brand2);border-radius:12px;padding:13px 15px;margin:6px 0 14px}
  .abanner .prog{display:flex;gap:5px;margin-top:10px}
  .abanner .prog i{height:6px;flex:1;border-radius:3px;background:var(--line2)}
  .abanner .prog i.done{background:var(--accent)}
  .aban .aban i.now{background:var(--brand)}
  .stepedit{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line2);border-radius:11px;padding:11px;margin-bottom:9px}
  .stepedit .kind{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex:none;background:var(--panel2);border:1px solid var(--line2)}
  .stepedit .kind.act{background:rgba(18,200,165,.15);border-color:var(--accent);color:var(--accent)}
  .stepedit .kind.wait{background:rgba(255,176,32,.13);border-color:var(--warm);color:var(--warm)}
  .stepedit .kind.trig{background:linear-gradient(135deg,var(--brand),var(--brand2));border:none;color:#fff}
  .stepedit .grow{flex:1;min-width:0}
  .stepedit .mv{display:flex;flex-direction:column;gap:3px}
  .minibtn{width:26px;height:22px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);color:var(--mut);font-size:12px;display:grid;place-items:center;cursor:pointer}
  .minibtn:hover{color:#fff;border-color:var(--brand2)}
  .in.sm{padding:8px 10px;font-size:13px}
  .row2{display:grid;grid-template-columns:120px 1fr;gap:8px;margin-top:7px}
  .addrow{display:flex;gap:9px;margin:4px 0 2px}
  .addrow button{flex:1;justify-content:center}
  .logtbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .logtbl th{text-align:left;color:var(--mut2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line2)}
  .logtbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
  .logtbl tr:last-child td{border:none}
  .stat-sent{color:var(--accent);font-weight:700}
  .stat-rep{color:var(--hot);font-weight:700}
  .empty{text-align:center;padding:50px 20px;color:var(--mut)}
  .empty .big{font-size:40px;margin-bottom:10px}
  .tl{position:relative;padding-left:22px}
  .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line2)}
  .tl .ev{position:relative;padding:0 0 16px 4px}
  .tl .ev::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand2);box-shadow:0 0 0 3px var(--bg2)}
  .tl .ev.hot::before{background:var(--hot)}
  .tl .ev b{font-size:13px} .tl .ev span{color:var(--mut2);font-size:11.5px}
  .badge2{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--panel2);border:1px solid var(--line2)}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--panel2);border:1px solid var(--accent);
    padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:90;display:flex;gap:11px;align-items:center;
    transform:translateY(120px);transition:.35s;max-width:340px}
  .toast.on{transform:translateY(0)}
  .toast .ic{font-size:18px}
  .split{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv:last-child{border:none}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:3px}
  .seg button{padding:7px 13px;border-radius:7px;font-size:12.5px;font-weight:650;color:var(--mut)}
  .seg button.on{background:var(--brand);color:#fff}
  .prog-ring{--p:0}
  .fade{animation:fadein .28s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .recwrap video{width:100%;max-height:260px;border-radius:12px;background:#000;display:block;object-fit:cover}
  @media(max-width:980px){
    .app{grid-template-columns:1fr}
    .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;z-index:50;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
    .brand{padding:0 6px 0 0}
    .brand h1{font-size:14px}
    .brand small{display:none}
    .nav{flex-direction:row;margin-top:0;gap:4px}
    .nav button{padding:8px 10px;font-size:12.5px;white-space:nowrap}
    .nav .ic{display:none}
    .side .up{display:none}
    .main{padding:18px 14px 60px}
    .g4{grid-template-columns:repeat(2,1fr)}
    .g3,.g2,.split{grid-template-columns:1fr}
  }
</style>
</head>

<div class="app">

</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"><span class="ic">✅</span><span id="toastmsg"></span></div>

function statCard(lab,val,delta,up,sp){
  return `<div class="card stat"><div class="lab">${lab}</div><div class="val">${val}</div>
    ${delta==='—'?`<div class="delta" style="color:var(--mut2)">— no activity yet</div>`:`<div class="delta ${up?'up':'down'}">${up?'▲':'▼'} ${delta}</div>`}<div class="spark">${sp}</div></div>`;
}
function spark(arr){const mx=Math.max(...arr)||1,w=64,h=30,st=w/(arr.length-1);
  const pts=arr.map((v,i)=>`${i*st},${h-(v/mx*(h-4))-2}`).join(' ');
  return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="var(--brand2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function feat(ic,t,d){return `<div class="card"><div style="font-size:24px">${ic}</div><b style="display:block;margin:9px 0 5px;font-size:14.5px">${t}</b><p class="muted fz13" style="margin:0;line-height:1.5">${d}</p></div>`;}
/* ============ DERIVED METRICS (computed from real data) ============ */
function aggViews(){return sum(S.cards.map(c=>c.views));}
function aggUniq(){return sum(S.cards.map(c=>c.uniq));}
function aggClicks(){return sum(S.cards.map(c=>c.clicks));}
function aggWatched(){return Math.round(sum(S.cards.map(c=>c.uniq*c.watchPct/100)));}
function avgWatchPct(){return S.cards.length?Math.round(sum(S.cards.map(c=>c.watchPct))/S.cards.length):0;}
function avgScore(){return S.contacts.length?Math.round(sum(S.contacts.map(c=>c.score))/S.contacts.length):0;}
function topCard(){return [...S.cards].sort((a,b)=>b.watchPct-a.watchPct)[0]||{title:'—',watchPct:0};}
function tapRate(){return Math.round(aggClicks()/Math.max(1,aggUniq())*100);}
function bookedContacts(){return S.contacts.filter(c=>/book|quot/i.test(c.lastAct)).length;}
function askedToTalk(){return S.contacts.filter(c=>/book|quot|talk|call|rate|interested/i.test(c.lastAct)||c.temp==='hot').length;}
function bookRate(){return Math.round(bookedContacts()/Math.max(1,S.contacts.length)*100);}
function replyRate(){const sent=S.outbox.length;if(sent>=5){return Math.round(S.outbox.filter(o=>o.status==='Replied').length/sent*100);}return tapRate();}
function sourceShare(){const pool=S.contacts.filter(c=>c.temp!=='cold');const base=pool.length||1;const by={};pool.forEach(c=>{by[c.source]=(by[c.source]||0)+1;});const col={'Facebook Lead':'#2f6dff','Referral':'#12c8a5','Direct Mail':'#ffb020','Cold List':'#ff5a5f'};return Object.keys(by).map(s=>({s,v:Math.round(by[s]/base*100),c:col[s]||'#5b8bff'})).sort((a,b)=>b.v-a.v);}
/* build a 7-point trend that ENDS at the real current value, shaped by the real weekly series */
function trend(cur){const w=S.weekly,mn=Math.min(...w),mx=Math.max(...w),rng=(mx-mn)||1;return w.map(x=>Math.round(cur*(0.8+0.2*(x-mn)/rng)));}
function deltaPct(s){const a=s[0]||1,b=s[s.length-1];return Math.round((b-a)/a*100);}
function deltaPts(s){return Math.round(s[s.length-1]-s[0]);}
function fpc(d){return (d>=0?'+':'')+d+'%';}
function fpt(d){return (d>=0?'+':'')+d+' pts';}

/* ============ SENDING ENGINE (simulated) ============ */
function activeAutos(){return S.autos.filter(a=>a.active);}
function seqOf(c){return c.auto?S.autos.find(a=>a.id===c.auto.seqId):null;}
function liveEnrolled(a){return S.contacts.filter(c=>c.auto&&c.auto.seqId===a.id);}
function trigKind(a){const s=a.steps[0];if(!s)return 'new';if(s.trig)return s.trig;const t=(s.title+' '+(s.desc||'')).toLowerCase();
  if(t.includes('watch'))return 'watched';if(t.includes('quote'))return 'quote';
  if(t.includes('no open')||t.includes('cold')||t.includes('7 day')||t.includes('no response'))return 'noopen';return 'new';}
function waitDaysOf(s){if(s.days!=null)return s.days;const m=(s.title||'').match(/(\d+)\s*day/i);return m?parseInt(m[1]):(/wait/i.test(s.title||'')?2:0);}
function channelOf(s){return s.channel||(/email/i.test((s.title||'')+' '+(s.desc||''))?'email':'sms');}
function cardOf(s){return s.cardId?S.cards.find(k=>k.id===s.cardId):null;}
function sendVerb(ch){return ch==='email'?'Email sent':'Card sent by text';}
function evMin(e){return e.day!=null?Math.max(2,(S.simDay-e.day)*1440+(e.min||30)):e.m;}
function matchTrig(k,c){
  if(k==='watched')return c.watchPct>=80&&!/book/i.test(c.lastAct);
  if(k==='quote')return /quot/i.test(c.lastAct);
  if(k==='noopen')return c.watchPct===0||c.temp==='cold';
  return c.temp!=='hot'&&c.watchPct<60; /* new / general nurture */
}
function eligibleFor(a){const k=trigKind(a);return S.contacts.filter(c=>!c.auto&&!((c.doneSeqs||[]).includes(a.id))&&matchTrig(k,c));}
function assignAuto(c,a){c.auto={seqId:a.id,step:0,waitDays:0};}
function fireAct(c,a,s){
  const ch=channelOf(s),card=cardOf(s);
  const what=card?card.title:(s.msg||s.title.replace(/^Day\s*\d+\s*[—-]\s*/i,''));
  c.events.unshift({t:sendVerb(ch)+': '+String(what).slice(0,58),day:S.simDay,min:10,auto:true});
  S.outbox.unshift({id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),day:S.simDay,cid:c.id,name:c.name,seq:a.name,channel:ch,action:(card?'Video card · '+card.title:(s.msg||s.title)),status:'Sent'});
  a.sent=(a.sent||0)+1;c.lastMin=1;
  let hot=false;
  if(Math.random()<0.55){
    c.watchPct=Math.min(100,c.watchPct+(16+Math.floor(Math.random()*24)));
    if(Math.random()<0.4)c.replays++;
    c.score=Math.min(99,c.score+(8+Math.floor(Math.random()*14)));
    c.lastAct='Watched '+c.watchPct+'% (auto touch)';
    c.events.unshift({t:'Watched '+c.watchPct+'% of card',day:S.simDay,min:8,auto:true});
    if(S.outbox[0])S.outbox[0].status='Opened';
    if(c.watchPct>=80&&c.score>=70){
      c.temp='hot';hot=true;c.clicks++;c.lastAct='🔥 High intent — asked to talk';
      c.events.unshift({t:'Tapped "Book a Call" — hot lead',day:S.simDay,min:5,hot:true,auto:true});
      if(S.outbox[0])S.outbox[0].status='Replied';
      a.replies=(a.replies||0)+1;
    }else if(c.score>=45){c.temp='warm';}
  }
  return {sent:true,hot,name:c.name};
}
function completeAuto(c,a){
  c.events.unshift({t:'Sequence "'+a.name+'" finished',day:S.simDay,min:15,auto:true});
  c.doneSeqs=(c.doneSeqs||[]);if(!c.doneSeqs.includes(a.id))c.doneSeqs.push(a.id);
  c.auto=null;return {done:true,name:c.name};
}
function stepContact(c){
  const a=seqOf(c);
  if(!a||!a.active){c.auto=null;return null;}
  if(c.auto.waitDays>0){c.auto.waitDays--;if(c.auto.waitDays>0)return null;}
  let i=c.auto.step;
  while(i<a.steps.length){
    const s=a.steps[i];
    if(s.type==='trig'){i++;continue;}
    if(s.type==='wait'){i++;const d=waitDaysOf(s);if(d>0){c.auto.step=i;c.auto.waitDays=d;return null;}continue;}
    c.auto.step=i+1;return fireAct(c,a,s);
  }
  return completeAuto(c,a);
}
function tick(){
  S.simDay++;
  /* pick up newly-eligible leads into active sequences (no fire yet — their Day-0 sends in the step loop) */
  activeAutos().forEach(a=>{if(liveEnrolled(a).length<6)eligibleFor(a).slice(0,6-liveEnrolled(a).length).forEach(c=>assignAuto(c,a));});
  let sends=0,hots=0,dones=0;
  S.contacts.slice().forEach(c=>{if(c.auto){const r=stepContact(c);if(r){if(r.sent){sends++;if(r.hot)hots++;}if(r.done)dones++;}}});
  return {sends,hots,dones};
}
function advanceDay(){

const VDB={db:null,
  open(){return new Promise((res,rej)=>{
    if(VDB.db)return res(VDB.db);
    const r=indexedDB.open('legacytap_vids',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('v');
    r.onsuccess=()=>{VDB.db=r.result;res(VDB.db);};
    r.onerror=()=>rej(r.error);});},
  async put(id,blob){const db=await VDB.open();return new Promise((res,rej)=>{
    const tx=db.transaction('v','readwrite');tx.objectStore('v').put(blob,id);
    tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});},
  async get(id){const db=await VDB.open();return new Promise((res,rej)=>{
    const rq=db.transaction('v').objectStore('v').get(id);
    rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);});}
};

    {type:'act',channel:'email',cardId:null,msg:'Last note from me — if the timing\'s wrong just say so and I\'ll stop reaching out.'}]},
  {id:'g3',name:'Post-quote follow-up',desc:'Keep quoted prospects warm until they sign.',steps:[
    {type:'trig',trig:'quote'},
    {type:'act',channel:'sms',cardId:'k3',msg:'Here\'s a recap of your numbers, {first} — locking before your birthday keeps the rate down.'},
    {type:'wait',days:2,cond:'notWatched'},
    {type:'act',channel:'sms',cardId:'k3',msg:'Rates tick up on your next birthday — want me to lock today\'s number in?'}]}
];
function condLabel(c){return c==='notWatched'?'if not watched':c==='watched'?'if watched ≥ 70%':'';}
function trigTitle(t){return 'Trigger: '+(TRIGGERS[t]||TRIGGERS.new);}
function trigDesc(t){return t==='new'?'Fires on import or manual add.':t==='watched'?'High intent, no next step taken yet.':t==='quote'?'Fires right after a quote goes out.':'Lead has gone quiet — time to re-engage.';}
function waitTitle(s){const d=s.days||0;return 'Wait '+d+' day'+(d===1?'':'s')+(s.cond&&s.cond!=='any'?' — '+condLabel(s.cond):'');}
function actTitle(s,card){if(card)return 'Send video card: '+card.title;return s.channel==='email'?'Send follow-up email':'Send reminder text';}
let seqDraft=null;
function openSeqBuilder(){
  seqDraft={editingId:null,name:'',steps:[{type:'trig',trig:'new'},{type:'act',channel:'sms',cardId:'k2',msg:'Hi {first}, quick 90-second video for you — no pressure.'}]};
  renderSeqBuilder();openM();
}
function editSeq(id){
  const a=S.autos.find(x=>x.id===id);
  seqDraft={editingId:id,name:a.name,steps:a.steps.map(s=>{
    if(s.type==='trig')return {type:'trig',trig:s.trig||trigKind(a)};
    if(s.type==='wait')return {type:'wait',days:waitDaysOf(s),cond:s.cond||(/not watch/i.test(s.title)?'notWatched':/watch/i.test(s.title)?'watched':'any')};
    const card=cardOf(s);return {type:'act',channel:channelOf(s),cardId:card?card.id:null,msg:s.msg||s.desc||s.title};
  })};
  renderSeqBuilder();openM();
}
function fillGoal(id){const g=SEQ_GOALS.find(x=>x.id===id);seqDraft.name=g.name;seqDraft.steps=g.steps.map(s=>({...s}));renderSeqBuilder();}
function sdAdd(kind){const s=kind==='wait'?{type:'wait',days:2,cond:'any'}:{type:'act',channel:'sms',cardId:null,msg:''};seqDraft.steps.push(s);renderSeqBuilder();}
function sdDel(i){if(seqDraft.steps[i].type==='trig')return;seqDraft.steps.splice(i,1);renderSeqBuilder();}
function sdMove(i,dir){const j=i+dir;if(j<1||j>=seqDraft.steps.length)return;/* keep trigger at 0 */const t=seqDraft.steps[i];seqDraft.steps[i]=seqDraft.steps[j];seqDraft.steps[j]=t;renderSeqBuilder();}
function sdSet(i,k,v){seqDraft.steps[i][k]=(k==='cardId'&&v==='')?null:v;renderSeqBuilder();}
function stepEditor(s,i,len){
  const card=s.type==='act'&&s.cardId?S.cards.find(k=>k.id===s.cardId):null;
  const kindIcon=s.type==='trig'?'⚡':s.type==='wait'?'⏳':'✦';
  let inner='';
  if(s.type==='trig'){
    inner=`<span class="tag">Trigger — when a lead enters</span>
      <select class="in sm" onchange="sdSet(${i},'trig',this.value)">${Object.keys(TRIGGERS).map(t=>`<option value="${t}"${s.trig===t?' selected':''}>${TRIGGERS[t]}</option>`).join('')}</select>`;
  }else if(s.type==='wait'){
    inner=`<span class="tag">Wait / condition</span>
      <div class="row2"><div><input class="in sm" type="number" min="0" value="${s.days}" oninput="seqDraft.steps[${i}].days=parseInt(this.value)||0"> </div>
      <select class="in sm" onchange="sdSet(${i},'cond',this.value)">
        <option value="any"${s.cond==='any'?' selected':''}>days — any time</option>
        <option value="notWatched"${s.cond==='notWatched'?' selected':''}>days — only if NOT watched</option>
        <option value="watched"${s.cond==='watched'?' selected':''}>days — only if watched ≥ 70%</option>
      </select></div>`;
  }else{
    inner=`<span class="tag">Action — send a touch</span>
      <div class="row2">
        <select class="in sm" onchange="sdSet(${i},'channel',this.value)"><option value="sms"${s.channel==='sms'?' selected':''}>💬 SMS</option><option value="email"${s.channel==='email'?' selected':''}>✉ Email</option></select>
        <select class="in sm" onchange="sdSet(${i},'cardId',this.value)"><option value=""${!s.cardId?' selected':''}>Plain text (no card)</option>${S.cards.map(k=>`<option value="${k.id}"${s.cardId===k.id?' selected':''}>🎥 ${k.title}</option>`).join('')}</select>
      </div>
      <textarea class="in sm" style="min-height:56px;margin-top:7px" placeholder="Message copy — use {first} for first name" oninput="seqDraft.steps[${i}].msg=this.value">${(s.msg||'').replace(/</g,'&lt;')}</textarea>`;
  }
  return `<div class="stepedit">
    <div class="kind ${s.type}">${kindIcon}</div>
    <div class="grow">${inner}</div>
    <div class="mv">
      ${s.type!=='trig'?`<button class="minibtn" title="Move up" onclick="sdMove(${i},-1)">▲</button><button class="minibtn" title="Move down" onclick="sdMove(${i},1)">▼</button><button class="minibtn" title="Delete" onclick="sdDel(${i})">✕</button>`:'<span class="mut2 fz12" style="writing-mode:vertical-rl">start</span>'}
    </div>
  </div>`;
}
function renderSeqBuilder(){
  const d=seqDraft;const acts=d.steps.filter(s=>s.type==='act').length;
  $('#modal').innerHTML=`
    <div class="mh"><h3>${d.editingId?'Edit sequence':'New sequence'}</h3><button class="x" onclick="closeM()">✕</button></div>
    <div class="mb">
      ${!d.editingId?`<div class="mut2 fz12 fw7" style="margin:0 0 8px">Quick-start from a goal (then tweak)</div>
      <div class="grid g3" style="margin-bottom:16px">${SEQ_GOALS.map(g=>`<div class="tmpl" onclick="fillGoal('${g.id}')"><b>${g.name}</b><p>${g.desc}</p></div>`).join('')}</div>`:''}
      <label class="fl">Sequence name</label>
      <input class="in" id="sd_name" placeholder="e.g. New Lead — 5-Touch Nurture" value="${(d.name||'').replace(/"/g,'&quot;')}" oninput="seqDraft.name=this.value">
      <label class="fl">Steps — runs top to bottom</label>
      ${d.steps.map((s,i)=>stepEditor(s,i,d.steps.length)).join('')}
      <div class="addrow">
        <button class="btn sm" onclick="sdAdd('act')">＋ Add action (send)</button>
        <button class="btn sm" onclick="sdAdd('wait')">＋ Add wait / condition</button>
      </div>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn ghost" style="flex:1;justify-content:center" onclick="closeM()">Cancel</button>
        <button class="btn primary" style="flex:2;justify-content:center" onclick="saveSeq()">${d.editingId?'Save changes':'Save sequence'} (${acts} touch${acts===1?'':'es'})</button>
      </div>
    </div>`;
}
function saveSeq(){
  const d=seqDraft;
  if(!d.steps.some(s=>s.type==='act')){toast('Add at least one action so the sequence can send something','⚠️');return;}
  const nm=(d.name||'').trim()||'Untitled sequence';
  const steps=d.steps.map(s=>{
    if(s.type==='trig')return {type:'trig',trig:s.trig,title:trigTitle(s.trig),desc:trigDesc(s.trig)};
    if(s.type==='wait')return {type:'wait',days:s.days,cond:s.cond,title:waitTitle(s),desc:''};
    const card=s.cardId?S.cards.find(k=>k.id===s.cardId):null;
    return {type:'act',channel:s.channel,cardId:s.cardId,msg:s.msg,title:actTitle(s,card),desc:s.msg||''};
  });
  if(d.editingId){const a=S.autos.find(x=>x.id===d.editingId);a.name=nm;a.steps=steps;}
  else{S.autos.unshift({id:'a'+Date.now(),name:nm,active:false,sent:0,replies:0,enrolled:0,reply:'—',steps});}
  const wasEdit=d.editingId;seqDraft=null;save();closeM();view='auto';render();
  toast(wasEdit?'Sequence updated ✎':'Sequence saved — flip it on to start sending ⚡','⚡');
}
/* ============ MODAL ============ */
function openM(){$('#overlay').classList.add('on');}
function closeM(){stopCam();$('#overlay').classList.remove('on');}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeM();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
if(!S.seededEnroll){try{bootstrapEnroll();save();}catch(e){}}
render();
</script>
</body>
</html>
